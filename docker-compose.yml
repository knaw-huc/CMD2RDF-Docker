services:
  graphdb:
    image: ontotext/graphdb:10.8.11
    container_name: graphdb
    ports:
      - "7200:7200"
    environment:
      GDB_JAVA_OPTS: >-
        -Xmx8g 
        -Xms4g
        -Dgraphdb.home=/opt/graphdb/home
        -Dgraphdb.workbench.cors.enable=true
        -Dgraphdb.append.request.id.headers=true
        -Denable-context-index=true
        -Dentity-pool-implementation=transactional
        -Dhealth.max.query.time.seconds=500
        -Dreuse.vars.in.subselects=true
    volumes:
        - graphdb-home:/opt/graphdb/home
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:7200/protocol" ]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    stop_grace_period: 90s
    profiles:
      - cmd2rdf-local

  graphdb-init:
    image: curlimages/curl:latest
    container_name: graphdb-init
    depends_on:
      graphdb:
        condition: service_healthy
    volumes:
      - ./ld:/app/ld:ro
    environment:
      - REPO_ID=${REPO_ID:-ost-clarin-skg}
      - GDB_URL=${GDB_URL:-http://graphdb:7200}
    entrypoint: [ "/app/ld/graphdb-init.sh" ]
    restart: no
    profiles:
      - cmd2rdf-local

  cmd2rdf:
    container_name: cmd2rdf
    build:
      context: .
      dockerfile: Dockerfile.cmd2rdf
    ports:
      - "8080:8080"
    volumes:
      - cmd2rdf-home:/app
    environment:
      - REPO_ID=${REPO_ID:-ost-clarin-skg}
      - GDB_URL=${GDB_URL:-http://graphdb:7200}
    tty: true
    stdin_open: true

volumes:
  graphdb-home:
  cmd2rdf-home:

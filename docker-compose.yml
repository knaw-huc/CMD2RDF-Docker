services:
  graphdb:
    build:
      context: .
      dockerfile: Dockerfile.graphdb
    ports:
      - "7200:7200"
    volumes:
      - shared-ld:/app/ld
      - shared-rdf:/app/work/rdf-output/temp

  graphdb-proxy:
    build:
      context: .
      dockerfile: Dockerfile.graphdb-proxy
    depends_on:
      - graphdb
    ports:
      - "8890:8080"

  cmd2rdf:
    build:
      context: .
      dockerfile: Dockerfile.cmd2rdf
    ports:
      - "8080:8080"
    volumes:
      - shared-ld:/app/ld
      - shared-rdf:/app/work/rdf-output/temp

volumes:
  shared-ld:
  shared-rdf:

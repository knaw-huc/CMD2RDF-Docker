events { }

http {
    error_log /dev/stderr debug;

    # Map query param "format" to the right Accept header for GraphDB
    map $arg_format $accept_override {
        default                                    "application/sparql-results+xml";
        "application/sparql-results+xml"           "application/sparql-results+xml";
        "application/atom+xml"                     "application/sparql-results+xml";
    }

    # For GraphDB, we need to normalize the named GIRI context param to %3C...%3E (keep if already wrapped)
    map $arg_context $ctx_wrapped {
        default "";
        ""      "";
        ~^%3[Cc].*%3[Ee]$  $arg_context;          # already %3C...%3E
        ~^<.*>$            $arg_context;          # already <...>
        ~.+                "%3C$arg_context%3E";  # bare URI -> wrap
    }

    # Remove any existing context=... from the original query string
    # Handles: at start, in middle, at end, or only param.
    map $query_string $args_wo_context {
        "~^context=[^&]*&(.*)$"          $1;           # start + others
        "~^(.*)&context=[^&]*&(.*)$"     $1&$2;        # middle
        "~^(.*)&context=[^&]*$"          $1;           # end
        "~^context=[^&]*$"               "";           # only param
        default                          $query_string;
    }

    # Build the normalized args: keep others, add context if present
    map "$args_wo_context|$ctx_wrapped" $args_norm {
        "~*^\|(.+)$"           "context=$1";          # no other args, only context
        "~*^(.*)\|(.+)$"       "$1&context=$2";       # others + context
        default                $args_wo_context;      # no context provided
    }

    # Add '?' only when we actually have args
    map $args_norm $is_args2 { "" ""; default "?"; }

    log_format proxydebug '$remote_addr - [$time_local] "$request" '
                          'status=$status '
                          'orig_ctx="$arg_context" wrapped_ctx="$ctx_wrapped" '
                          'args_norm="$args_norm" '
                          'req_len=$request_length sent=$body_bytes_sent '
                          'rt=$request_time upstream="$upstream_addr"'
                          'target_url=http://graphdb:7200/repositories/cmd2rdf/statements$is_args2$args_norm';

    access_log /dev/stdout proxydebug;

    server {
        listen 8080;

        location /sparql {
            proxy_pass http://graphdb:7200;
            proxy_http_version 1.1;

            proxy_buffering on;
            # No chunking please
            chunked_transfer_encoding off;
            # Erase accept encoding
            proxy_set_header Accept-Encoding "";
            # Set Accept header according to map
            proxy_set_header Accept $accept_override;

            # Rewrite 'old' sparql paths to correct GraphDB repository
            rewrite ^/sparql(.*)$ /repositories/REPO_ID$1 break;
        }

        # Direct pass-through for the statements creates, updates, deletes
        location /repositories/REPO_ID/statements {
            proxy_pass         http://graphdb:7200/repositories/cmd2rdf/statements$is_args2$args_norm;
            proxy_http_version 1.1;

            # don't touch Content-Type on uploads
            proxy_set_header   Accept-Encoding "";
            proxy_buffering on;
            chunked_transfer_encoding off;
        }
    }
}